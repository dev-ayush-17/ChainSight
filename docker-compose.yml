services:
  neo4j:
    image: neo4j:5.20-community
    container_name: chainsight-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Web Browser GUI
      - "7687:7687" # Bolt Protocol Port
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - ./data/raw/synthetic:/var/lib/neo4j/import/synthetic:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: chainsight-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      neo4j:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: ui.Dockerfile
    container_name: chainsight-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
